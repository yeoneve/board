<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간조 보드</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#FAFAFA;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:#161616;-webkit-tap-highlight-color:transparent}
.wrap{width:96%;max-width:720px;margin:10px auto}
.summary{display:flex;margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid #E8E8E8;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.035);position:sticky;top:0;z-index:100}
.summary-col{width:33.333%;border-right:1px solid #EEE;background:#fff}
.summary-col:last-child{border-right:0}
.summary-head{padding:6px 7px;font-size:14px;font-weight:700;border-bottom:3px solid transparent;text-align:center}
.summary-ob .summary-head{border-bottom-color:#4BA3FF}
.summary-ib .summary-head{border-bottom-color:#F36AA0}
.summary-cold .summary-head{border-bottom-color:#F4B83A}
.summary-body{padding:6px 7px;font-size:12px;min-height:54px}
.sum-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center}
.sum-table th{font-size:10px;font-weight:700;color:#777;padding:2px 0 4px;border-right:1px solid #EEE}
.sum-table td{font-size:13px;font-weight:700;padding:4px 0 2px;border-right:1px solid #EEE}
.sum-table th:last-child,.sum-table td:last-child{border-right:0}
.sum-table.mismatch td{color:#E5484D}
.summary-bottom{display:flex;border-top:1px solid #EEE}
.summary-extra{width:50%;padding:5px 3px;font-size:11px;text-align:center;white-space:nowrap}
.summary-guide{background:#F5FAFF}
.summary-line{background:#FFF6FA;border-left:1px solid #EEE}
.card{background:#fff;border:1px solid #E8E8E8;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.title{padding:8px 10px 8px 18px;font-size:17px;font-weight:700;border-bottom:1px solid #F0F0F0;position:relative}
.title:before{content:"";position:absolute;left:8px;top:9px;bottom:9px;width:4px;border-radius:10px}
.ob .title:before{background:#4BA3FF}.ib .title:before{background:#F36AA0}.cold .title:before{background:#F4B83A}
.body{display:flex;gap:8px;padding:8px;background:#fff}
.left{width:39%;min-width:0;border-right:1px solid #F0F0F0;padding-right:8px}
.right{width:61%;min-width:0}
.people-row{display:flex;align-items:center;margin-bottom:7px}
.people-title{width:58px;flex:none;font-size:12px;font-weight:700}
.people{flex:1;margin:0}
.person{display:block;font-size:11px;margin:0 0 4px 0;white-space:nowrap}
.person input{width:15px;height:15px;margin:0 3px 0 0;vertical-align:-3px}
.field{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.field label{font-size:11px;font-weight:700;white-space:nowrap}
.field input{width:46px;height:27px;background:#fff;border:1px solid #D9D9D9;border-radius:5px;color:#161616;text-align:center;font-size:16px;padding:0;-webkit-appearance:none;appearance:none}
.stepper{display:flex;align-items:center;gap:2px}
.step-controls{display:flex;align-items:center;gap:1px}
.step-btn{width:19px;height:22px;padding:0;border:1px solid #D9D9D9;border-radius:4px;background:#F7F7F8;color:#555;font-size:13px;line-height:20px;text-align:center;font-weight:600;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.step-btn:active{background:#EDEDEF}
.field input:focus{outline:none;border-color:#B8B8BC}
.field input.mismatch{color:#E53935;font-weight:700;border-color:#F1A7A5;background:#FFF7F7}
.preview{white-space:pre-wrap;background:#F8F8F9;border:1px solid #EBEBED;border-radius:6px;padding:7px;font-size:10.5px;line-height:1.45;min-height:196px;overflow-wrap:anywhere;color:#252525}
.copy{width:100%;height:34px;border:0;border-radius:8px;margin-top:6px;font-size:12px;font-weight:700;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.ob .copy{background:#3295F6}.ib .copy{background:#E85D93}.cold .copy{background:#E5A526}
.copy:active{transform:scale(.985)}.copy.ok{opacity:.65}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@supports(padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}}
@media(max-width:430px){
  .wrap{width:calc(100% - 12px);margin:6px auto}
  .summary{top:0}
  .summary-head{font-size:13px;padding:6px 3px}
  .summary-body{padding:5px 3px}
  .sum-table th{font-size:9px}
  .sum-table td{font-size:12px}
  .summary-extra{font-size:10px;padding:5px 1px}
  .body{gap:6px;padding:7px}
  .left{width:42%;padding-right:6px}
  .right{width:58%}
  .people-title{width:52px;font-size:11px}
  .person{font-size:10.5px}
  .field label{font-size:10px}
  .field input{width:40px;height:27px;font-size:16px}
  .stepper{gap:1px}
  .step-controls{gap:1px}
  .step-btn{width:17px;height:22px;font-size:12px;line-height:20px}
  .preview{font-size:9.7px;padding:6px;line-height:1.42}
}
@media(max-width:375px){
  .left{width:44%}
  .right{width:56%}
  .people-title{width:48px}
  .field input{width:37px}
  .step-btn{width:16px}
  .preview{font-size:9.2px}
}
@media(max-width:340px){
  .body{gap:4px;padding:6px}
  .left{width:46%;padding-right:4px}
  .right{width:54%}
  .field input{width:34px}
  .step-btn{width:15px;font-size:11px}
  .preview{font-size:8.8px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="summary">
<div class="summary-col summary-ob"><div class="summary-head">상온 OB</div><div class="summary-body" id="sum-ob"></div><div class="summary-bottom"><div class="summary-extra summary-guide" id="sum-guide">인솔 : 0</div><div class="summary-extra summary-line" id="sum-line">줄 : 0</div></div></div>
<div class="summary-col summary-ib"><div class="summary-head">상온 IB</div><div class="summary-body" id="sum-ib"></div></div>
<div class="summary-col summary-cold"><div class="summary-head">냉장 IB</div><div class="summary-body" id="sum-cold"></div></div>
</div>
<div id="app"></div>
</div>
<script>
const names=["심대원","김담희","유희연"];
const data=[
{key:"ob",title:"상온 OB",target:25,planned:32,existing:31,newcomer:1,training:0,extension:0,manual:0,selected:["김담희","유희연"]},
{key:"ib",title:"상온 IB",target:10,planned:13,existing:13,newcomer:0,training:0,extension:0,manual:0,selected:[]},
{key:"cold",title:"냉장 IB",target:5,planned:5,existing:5,newcomer:0,training:0,extension:0,manual:0,selected:[]}
];
const STORAGE_KEY="dayboard-persistent";
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
function loadData(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!Array.isArray(saved))return;saved.forEach(savedItem=>{const x=data.find(d=>d.key===savedItem.key);if(!x)return;["target","planned","existing","newcomer","training","extension","manual"].forEach(k=>{if(Number.isFinite(Number(savedItem[k])))x[k]=Number(savedItem[k])});if(Array.isArray(savedItem.selected))x.selected=savedItem.selected.filter(n=>names.includes(n))})}catch(e){}}
loadData();
const labels=[["target","목표 T/O"],["planned","예정 T/O"],["existing","기존"],["newcomer","신규"],["training","재교육"],["extension","연장가능"],["manual","수기작성"]];
function today(){const d=new Date(),w=["일","월","화","수","목","금","토"];return `${d.getMonth()+1}월 ${d.getDate()}일 (${w[d.getDay()]})`}
function item(key){return data.find(x=>x.key===key)}
function report(x){const p=x.selected;return `컬리 K팀 ${today()}

${x.title} 13시30분 인원투입 공유
(13:30 ~ 22:30)

인솔담당 - ${p.length}명${p.length?` (${p.join(", ")})`:""}

총 T/O : ${x.target} / ${x.planned} (기존 ${x.existing}, 신규 ${x.newcomer}${x.training?`, 재교육 ${x.training}`:""})

계약
컬리로 : ${x.planned}명
수기작성 : ${x.manual}명

연장 가능 인원 : ${x.extension}명

총 투입 인원 : ${x.planned+x.extension}명`}
function card(x){return `<section class="card ${x.key}"><div class="title">${x.title}</div><div class="body"><div class="left"><div class="people-row"><div class="people-title">인솔담당</div><div class="people">${names.map(n=>`<label class="person"><input type="checkbox" data-person="${n}" data-key="${x.key}" ${x.selected.includes(n)?"checked":""}>${n}</label>`).join("")}</div></div>${labels.map(([k,l])=>`<div class="field"><label>${l}</label><div class="stepper"><input inputmode="numeric" type="number" min="0" value="${x[k]}" data-field="${k}" data-key="${x.key}"><div class="step-controls"><button type="button" class="step-btn" data-step="-1" data-step-field="${k}" data-key="${x.key}">−</button><button type="button" class="step-btn" data-step="1" data-step-field="${k}" data-key="${x.key}">+</button></div></div></div>`).join("")}</div><div class="right"><div class="preview" id="preview-${x.key}"></div><button class="copy" data-copy="${x.key}">📋 복사</button></div></div></section>`}
document.getElementById("app").innerHTML=data.map(card).join("");
function update(key){const x=item(key),detailTotal=x.existing+x.newcomer+x.training,mismatch=detailTotal!==x.planned;document.getElementById("preview-"+key).textContent=report(x);const sum=document.getElementById("sum-"+key);sum.innerHTML=`<table class="sum-table ${mismatch?"mismatch":""}"><tr><th>T</th><th>기</th><th>신</th><th>재</th></tr><tr><td>${x.planned}</td><td>${x.existing}</td><td>${x.newcomer}</td><td>${x.training}</td></tr></table>`;["existing","newcomer","training"].forEach(field=>{const el=document.querySelector(`[data-field="${field}"][data-key="${key}"]`);if(el)el.classList.toggle("mismatch",mismatch)});if(key==="ob"){document.getElementById("sum-guide").textContent=`인솔 : ${x.selected.length}`;document.getElementById("sum-line").textContent=`줄 : ${Math.max(0,x.existing-x.selected.length)}`}}
data.forEach(x=>update(x.key));
document.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("input",()=>{const x=item(el.dataset.key);x[el.dataset.field]=Number(el.value)||0;update(x.key);saveData()}));
document.querySelectorAll("[data-step]").forEach(btn=>btn.addEventListener("click",()=>{const x=item(btn.dataset.key),field=btn.dataset.stepField,next=Math.max(0,(Number(x[field])||0)+Number(btn.dataset.step));x[field]=next;const input=document.querySelector(`[data-field="${field}"][data-key="${x.key}"]`);if(input)input.value=next;update(x.key);saveData()}));
document.querySelectorAll("[data-person]").forEach(el=>el.addEventListener("change",()=>{const x=item(el.dataset.key);x.selected=[...document.querySelectorAll(`[data-person][data-key="${x.key}"]:checked`)].map(e=>e.dataset.person);update(x.key);saveData()}));

async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch(e){}}const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
document.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",async()=>{const box=document.getElementById("preview-"+btn.dataset.copy),ok=await copyText(box.textContent);if(ok){btn.textContent="✓ 복사 완료";btn.classList.add("ok");setTimeout(()=>{btn.textContent="📋 복사";btn.classList.remove("ok")},1200)}else{const range=document.createRange();range.selectNodeContents(box);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);alert("브라우저가 자동 복사를 차단했습니다. 선택된 내용을 길게 눌러 복사해주세요.")}}));
</script>
</body>
</html>
