<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간조 보드</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#FAFAFA;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:#161616;-webkit-tap-highlight-color:transparent}
.wrap{width:96%;max-width:720px;margin:10px auto}
.summary{display:flex;margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid #E8E8E8;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.035);position:sticky;top:0;z-index:100}
.summary-col{width:33.333%;border-right:1px solid #EEE;background:#fff}
.summary-col:last-child{border-right:0}
.summary-head{padding:6px 7px;font-size:14px;font-weight:700;border-bottom:3px solid transparent;text-align:center}
.summary-ob .summary-head{border-bottom-color:#4BA3FF}
.summary-ib .summary-head{border-bottom-color:#F36AA0}
.summary-cold .summary-head{border-bottom-color:#F4B83A}
.summary-body{padding:6px 7px;font-size:12px;min-height:54px}
.sum-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center}
.sum-table th:first-child,.sum-table td:first-child{width:34%}
.sum-table th:not(:first-child),.sum-table td:not(:first-child){width:22%}
.sum-table td:first-child{white-space:nowrap;font-size:12px}
.sum-table th{font-size:10px;font-weight:700;color:#777;padding:2px 0 4px;border-right:1px solid #EEE;line-height:1.25}
.sum-table td{font-size:13px;font-weight:700;padding:4px 0 2px;border-right:1px solid #EEE;line-height:1.25}
.sum-table th:last-child,.sum-table td:last-child{border-right:0}
.sum-table.mismatch td{color:#E5484D}
.sum-table td.positive-purple{color:#F28C28}
.summary-bottom{display:flex;border-top:1px solid #EEE}
.summary-extra{width:50%;padding:5px 3px;font-size:11px;text-align:center;white-space:nowrap}
.summary-guide{background:#F5FAFF}
.summary-line{background:#FFF6FA;border-left:1px solid #EEE}
.summary-edu{background:#FFF3E6}
.summary-empty{background:#fff;border-left:1px solid #EEE}
.card{background:#fff;border:1px solid #E8E8E8;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.title{padding:8px 10px 8px 18px;font-size:17px;font-weight:700;border-bottom:1px solid #F0F0F0;position:relative}
.title:before{content:"";position:absolute;left:8px;top:9px;bottom:9px;width:4px;border-radius:10px}
.ob .title:before{background:#4BA3FF}.ib .title:before{background:#F36AA0}.cold .title:before{background:#F4B83A}
.body{display:flex;gap:8px;padding:8px;background:#fff}
.left{width:39%;min-width:0;border-right:1px solid #F0F0F0;padding-right:8px}
.right{width:61%;min-width:0}
.people-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px}
.people-title{flex:none;font-size:12px;font-weight:700;padding-top:1px}
.people{width:94px;flex:none;margin:0}
.person{display:block;font-size:11px;margin:0 0 4px 0;white-space:nowrap}
.person input{width:15px;height:15px;margin:0 3px 0 0;vertical-align:-3px}
.field{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.field label{font-size:11px;font-weight:700;white-space:nowrap}
.field input{width:46px;height:27px;background:#fff;border:1px solid #D9D9D9;border-radius:5px;color:#161616;text-align:center;font-size:16px;padding:0;-webkit-appearance:none;appearance:none}
.stepper{display:flex;align-items:center;gap:2px}
.step-controls{display:flex;align-items:center;gap:3px}
.step-btn{width:24px;height:24px;padding:0;border:1px solid #D9D9D9;border-radius:4px;background:#F7F7F8;color:#555;font-size:16px;line-height:24px;text-align:center;font-weight:600;-webkit-appearance:none;appearance:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;text-align:center}
.step-btn:active{background:#EDEDEF}
.field input:focus{outline:none;border-color:#B8B8BC}
.field input.mismatch{color:#E53935;font-weight:700;border-color:#F1A7A5;background:#FFF7F7}
.preview{white-space:pre-wrap;background:#F8F8F9;border:1px solid #EBEBED;border-radius:6px;padding:7px;font-size:10.5px;line-height:1.45;min-height:196px;overflow-wrap:anywhere;color:#252525}
.copy{width:100%;height:34px;border:0;border-radius:8px;margin-top:6px;font-size:12px;font-weight:700;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.ob .copy{background:#3295F6}.ib .copy{background:#E85D93}.cold .copy{background:#E5A526}
.copy:active{transform:scale(.985)}.copy.ok{opacity:.65}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@supports(padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}}
@media(max-width:430px){
  .wrap{width:calc(100% - 12px);margin:6px auto}
  .summary{top:0}
  .summary-head{font-size:13px;padding:6px 3px}
  .summary-body{padding:5px 3px}
  .sum-table th{font-size:9px}
  .sum-table td{font-size:12px}
  .summary-extra{font-size:10px;padding:5px 1px}
  .body{gap:6px;padding:7px}
  .left{width:42%;padding-right:6px}
  .right{width:58%}
  .people-title{font-size:11px}
  .people{width:90px}
  .person{font-size:10.5px}
  .field label{font-size:10px}
  .field input{width:40px;height:27px;font-size:16px}
  .stepper{gap:1px}
  .step-controls{gap:1px}
  .step-btn{width:23px;height:23px;font-size:12px;line-height:20px}
  .preview{font-size:9.7px;padding:6px;line-height:1.42}
}
@media(max-width:375px){
  .left{width:44%}
  .right{width:56%}
  .people{width:86px}
  .field input{width:37px}
  .step-btn{width:22px;height:22px}
  .preview{font-size:9.2px}
}
@media(max-width:340px){
  .body{gap:4px;padding:6px}
  .left{width:46%;padding-right:4px}
  .right{width:54%}
  .field input{width:34px}
  .step-btn{width:21px;height:21px;font-size:11px}
  .preview{font-size:8.8px}
}

.top-tabs{display:flex;gap:6px;margin-bottom:10px}
.top-tab{flex:1;height:40px;border:1px solid #E3E3E6;border-radius:11px;background:#fff;color:#777;font-size:14px;font-weight:800}
.top-tab.active{background:#161616;color:#fff;border-color:#161616}
.board-page{display:none}.board-page.active{display:block}
.report-list{display:grid;gap:10px}
.report-section{background:#fff;border:1px solid #E7E7E9;border-radius:14px;overflow:hidden}
.report-heading{padding:10px 12px;font-size:17px;font-weight:900}
.report-section.in .report-heading{background:#DCEFFD;color:#095CC5}
.report-section.out .report-heading{background:#F7DCE8;color:#B000C8}
.report-item{padding:8px 10px;border-top:1px solid #EEEEF0;display:flex;align-items:stretch;gap:7px}
.report-text{flex:1;min-width:0;white-space:pre-wrap;background:#F7F7F8;border:1px solid #E7E7E9;border-radius:9px;padding:8px;font-size:12px;line-height:1.45}
.report-copy{flex:0 0 58px;width:58px;min-width:58px;margin:0;border:0;border-radius:8px;background:#D9D9DC;color:#444;font-size:12px;font-weight:800}


.report-options{display:flex;gap:5px;padding:8px 10px 0;flex-wrap:wrap}
.report-options label{display:flex;align-items:center;gap:4px;background:#F2F2F3;border:1px solid #E0E0E2;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:700;color:#555}
.report-options input{accent-color:#777}

/* 보고용 - 주간조 디자인 톤과 통일 */
#reportBoard{padding-bottom:8px}
.report-list{gap:8px}
.report-section{
  background:#fff;
  border:1px solid #E6E6E8;
  border-radius:12px;
  box-shadow:none;
  overflow:hidden;
}
.report-heading{
  background:#fff !important;
  color:#222 !important;
  padding:10px 12px 7px;
  font-size:14px;
  font-weight:800;
  border-bottom:1px solid #EEEEF0;
}
.report-item{
  padding:8px 10px;
  display:flex;
  align-items:stretch;
  gap:6px;
  border-top:0;
}
.report-text{
  flex:1;
  min-width:0;
  padding:8px 9px;
  background:#F4F4F5;
  border:1px solid #E3E3E5;
  border-radius:7px;
  font-size:12px;
  line-height:1.45;
}
.report-copy{
  flex:0 0 58px;
  width:58px;
  min-width:58px;
  margin:0;
  border:1px solid #D4D4D7;
  border-radius:7px;
  background:#E5E5E7;
  color:#444;
  font-size:12px;
  font-weight:800;
}
.report-options{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:0 10px 9px;
}
.report-options label{
  min-height:30px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  background:#F3F3F4;
  border:1px solid #E1E1E3;
  border-radius:7px;
  color:#555;
  font-size:11px;
  font-weight:700;
}
.report-options input{
  width:15px;
  height:15px;
  margin:0;
  accent-color:#7D22FF;
}

/* 줄 탭 */
.jul-card{background:#fff;border:1px solid #E6E6E8;border-radius:12px;padding:12px}
.jul-date{text-align:center;font-size:13px;font-weight:700;margin-bottom:12px}
.jul-main-title{text-align:center;font-size:12px;font-weight:800;color:#666;margin-bottom:5px}
.jul-main-control{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px}
.jul-btn{width:36px;height:36px;border:1px solid #D8D8DB;border-radius:8px;background:#F1F1F2;font-size:22px;font-weight:700;color:#555}
.jul-main-input{width:92px;height:52px;border:1px solid #CFCFD2;border-radius:8px;background:#F4F4F5;text-align:center;font-size:30px;font-weight:800}
.jul-row{display:grid;grid-template-columns:72px 1fr;align-items:center;border-top:1px solid #EEEEF0;padding:9px 0}
.jul-label{font-size:12px;font-weight:800;color:#555}
.jul-value{font-size:20px;font-weight:800}
.jul-subgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
.jul-sub{background:#F4F4F5;border-radius:8px;padding:9px;text-align:center}
.jul-sub span{display:block;font-size:11px;font-weight:700;color:#666;margin-bottom:3px}
.jul-sub strong{font-size:23px}

/* 줄 탭 - 원본 시트 위치 구성 */
.line-sheet{background:#fff;border:1px solid #E6E6E8;border-radius:12px;padding:18px 10px 14px}
.line-top{display:grid;grid-template-columns:1fr 34px 1fr;align-items:end;gap:6px;width:calc(100% - 88px);margin:0 0 10px 88px}
.line-group{text-align:center}
.line-num-label{font-size:15px;margin-bottom:4px}
.line-box{border:1px solid #333;background:#F2F2F2}
.line-step{position:relative;border-bottom:1px dotted #777;min-height:54px;display:flex;align-items:center;justify-content:center}
.line-big-input{width:68px;height:52px;border:0;background:transparent;text-align:center;font-size:31px;outline:0}
.line-small-input{width:100%;height:45px;border:0;background:transparent;text-align:center;font-size:28px;outline:0}
.line-pm{position:absolute;top:50%;transform:translateY(-50%);width:27px;height:27px;border:1px solid #D0D0D3;border-radius:6px;background:#fff;color:#555;font-size:18px;line-height:1}
.line-pm[data-delta="-1"]{left:4px}.line-pm[data-delta="1"]{right:4px}
.line-multi{display:flex;flex-direction:column;justify-content:flex-end;gap:35px;padding-bottom:14px;text-align:center;font-size:12px}
.line-result-row{display:grid;grid-template-columns:44px 1fr 1fr 34px 1fr;gap:0;width:100%;margin:8px 0 0;background:transparent;color:#fff;align-items:stretch}
.line-result-title{height:50px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:800;border-right:1px dotted #fff;background:#6D6D6D}
.line-result-main{height:50px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:900;font-style:italic;background:#6D6D6D}
.line-result-part{height:50px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;background:#6D6D6D}
.line-attendance-row{display:grid;grid-template-columns:88px 1fr;align-items:center;margin-bottom:22px}
.line-attendance-row span{font-size:12px;padding:8px 4px}
.line-attendance-row strong{font-size:24px;font-weight:500;color:#CF6666}
.line-bottom{display:grid;grid-template-columns:1.3fr .8fr .9fr;gap:10px;align-items:end}
.line-total-wrap{display:grid;grid-template-columns:42px 1fr;align-items:center;border:1px solid #333;height:48px}
.line-total-wrap span{text-align:center;font-size:15px;border-right:1px dotted #555}
.line-total-wrap input{width:100%;height:46px;border:0;background:#fff;text-align:center;font-size:27px;font-weight:800;font-style:italic;outline:0}
.line-stat{text-align:center}
.line-stat span{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
.line-stat input{width:100%;height:44px;border:0;background:#F1F1F1;text-align:center;font-size:25px;outline:0}
@media(max-width:380px){
 .line-sheet{padding-left:6px;padding-right:6px}
 .line-top{grid-template-columns:1fr 28px 1fr}
 .line-pm{width:24px;height:24px;font-size:16px}
 .line-big-input{width:54px}
 .line-result-row{grid-template-columns:44px 1fr 1fr 34px 1fr}
}

.line-sub-step{position:relative;height:45px;display:flex;align-items:center;justify-content:center}
.line-sub-step .line-small-input{width:58px;height:43px}
.line-sub-pm{top:50%}
.line-result-blank{height:50px;background:#6D6D6D}
.line-final-row{display:grid;grid-template-columns:88px 1fr;align-items:center;margin:-14px 0 22px}
.line-final-row span{font-size:12px;padding:8px 4px;font-weight:800}
.line-final-row strong{font-size:27px;font-weight:900;font-style:italic}

/* 줄 탭 최종 디자인 - 주간조 톤 */
#lineBoard{}
#julBoard{padding-bottom:8px}
.line-sheet{
  background:transparent;
  border:0;
  border-radius:0;
  padding:2px 0 10px;
}
.line-top{
  width:100%;
  margin:0 0 8px;
  grid-template-columns:1fr 30px 1fr;
  gap:7px;
}
.line-group{
  background:#fff;
  border:1px solid #E6E6E8;
  border-radius:12px;
  padding:8px;
}
.line-num-label{
  margin:0 0 7px;
  font-size:13px;
  font-weight:800;
  color:#333;
}
.line-box{
  border:0;
  background:transparent;
}
.line-step,.line-sub-step{
  height:40px;
  min-height:40px;
  margin-bottom:6px;
  border:0;
  border-radius:8px;
  background:#F2F2F3;
}
.line-sub-step{margin-bottom:0}
.line-big-input,.line-small-input,
.line-sub-step .line-small-input{
  width:52px;
  height:38px;
  font-size:22px;
  font-weight:800;
  background:transparent;
}
.line-pm{
  width:29px;
  height:29px;
  border:0;
  border-radius:7px;
  background:#E7E1FF;
  color:#6D3BEA;
  font-size:18px;
  font-weight:900;
}
.line-pm[data-delta="-1"]{left:5px}
.line-pm[data-delta="1"]{right:5px}
.line-multi{
  gap:29px;
  padding-bottom:14px;
  color:#777;
  font-size:11px;
  font-weight:800;
}
.line-result-row{
  width:100%;
  grid-template-columns:42px 1fr 1fr 30px 1fr;
  margin:0 0 7px;
}
.line-result-title,.line-result-blank,.line-result-main,.line-result-part{
  height:44px;
}
.line-result-title,.line-result-blank{
  background:#707073;
}
.line-result-title{
  border-radius:9px 0 0 9px;
  font-size:13px;
}
.line-result-blank{border-radius:0 9px 9px 0}
.line-result-part{
  border-radius:9px;
  background:#707073;
  font-size:21px;
  font-weight:800;
}
.line-attendance-row{
  grid-template-columns:72px 1fr;
  min-height:42px;
  margin:0 0 8px;
  padding:0 9px;
  border:1px solid #E6E6E8;
  border-radius:10px;
  background:#fff;
}
.line-attendance-row span{
  padding:0;
  font-size:12px;
  font-weight:800;
  color:#555;
}
.line-attendance-row strong{
  font-size:20px;
  font-weight:800;
  color:#D26767;
}
.line-final-row{
  grid-template-columns:72px 1fr;
  min-height:46px;
  margin:0 0 9px;
  padding:0 9px;
  border-radius:10px;
  background:#F1ECFF;
}
.line-final-row span{
  padding:0;
  font-size:12px;
  font-weight:800;
  color:#6542B8;
}
.line-final-row strong{
  font-size:24px;
  color:#4D2BA4;
  font-style:normal;
}
.line-bottom{
  grid-template-columns:1.15fr .9fr .9fr;
  gap:7px;
}
.line-total-wrap,.line-stat{
  min-height:62px;
  box-sizing:border-box;
  border:1px solid #E6E6E8;
  border-radius:10px;
  background:#fff;
}
.line-total-wrap{
  height:62px;
  grid-template-columns:38px 1fr;
  overflow:hidden;
}
.line-total-wrap span{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid #EEEEF0;
  font-size:12px;
  font-weight:800;
  color:#555;
}
.line-total-wrap input{
  height:60px;
  font-size:23px;
  font-style:normal;
  background:#F5F5F6;
}
.line-stat{
  padding:7px 6px 6px;
}
.line-stat span{
  margin:0 0 4px;
  font-size:11px;
  color:#555;
}
.line-stat input{
  height:34px;
  border-radius:7px;
  background:#F2F2F3;
  font-size:20px;
  font-weight:800;
}
@media(max-width:380px){
 .line-top{grid-template-columns:1fr 26px 1fr}
 .line-result-row{grid-template-columns:38px 1fr 1fr 26px 1fr}
 .line-group{padding:7px 5px}
 .line-pm{width:26px;height:26px}
}

/* 줄 탭 간격 축소 */
.line-sheet{padding:0 0 6px}
.line-top{grid-template-columns:1fr 24px 1fr;gap:5px;margin-bottom:5px}
.line-group{padding:6px;border-radius:10px}
.line-num-label{margin-bottom:4px;font-size:12px}
.line-step,.line-sub-step{height:36px;min-height:36px;margin-bottom:4px;border-radius:7px}
.line-sub-step{margin-bottom:0}
.line-big-input,.line-small-input,.line-sub-step .line-small-input{height:34px;font-size:20px}
.line-pm{width:25px;height:25px;border-radius:6px;font-size:16px}
.line-pm[data-delta="-1"]{left:4px}.line-pm[data-delta="1"]{right:4px}
.line-multi{gap:24px;padding-bottom:10px;font-size:10px}

/* 1번/2번 합계는 위 카드와 같은 열에 바로 정렬 */
.line-result-row{
  display:grid;
  grid-template-columns:1fr 24px 1fr;
  gap:5px;
  width:100%;
  margin:0 0 5px;
}
.line-result-part{
  height:38px;
  border-radius:8px;
  background:#707073;
  font-size:19px;
}
.line-result-spacer{height:38px}

.line-attendance-row{
  grid-template-columns:64px 1fr;
  min-height:36px;
  margin-bottom:5px;
  padding:0 7px;
  border-radius:8px;
}
.line-attendance-row span{font-size:11px}
.line-attendance-row strong{font-size:18px}

.line-final-row{
  grid-template-columns:64px 1fr;
  min-height:38px;
  margin:0 0 6px;
  padding:0 7px;
  border-radius:8px;
}
.line-final-row span{font-size:11px}
.line-final-row strong{font-size:21px}

.line-bottom{gap:5px}
.line-total-wrap,.line-stat{min-height:54px;border-radius:8px}
.line-total-wrap{height:54px;grid-template-columns:34px 1fr}
.line-total-wrap input{height:52px;font-size:21px}
.line-total-wrap span{font-size:11px}
.line-stat{padding:5px}
.line-stat span{margin-bottom:2px;font-size:10px}

 .line-top,.line-result-row{grid-template-columns:1fr 20px 1fr}
 .line-group{padding:5px 4px}
}

/* 줄 탭 v31 - compact clean */
#julBoard{padding-bottom:6px}
.line-sheet{padding:0;background:transparent}
.line-top{grid-template-columns:1fr 22px 1fr;gap:5px;margin-bottom:5px}
.line-group{
  padding:6px;
  border:1px solid #E7E7EC;
  border-radius:10px;
  background:#fff;
}
.line-group:first-child{box-shadow:inset 0 3px 0 #DDE8FF}
.line-group:last-child{box-shadow:inset 0 3px 0 #F1E3FF}
.line-num-label{margin-bottom:4px;font-size:12px;font-weight:900;color:#3F4148}
.line-step,.line-sub-step{
  height:35px;min-height:35px;margin-bottom:4px;
  border:0;border-radius:7px;background:#F5F5F7
}
.line-sub-step{margin-bottom:0}
.line-big-input,.line-small-input,.line-sub-step .line-small-input{

.line-pm{
  width:25px;height:25px;border:0;border-radius:6px;
  background:#E9E5FF;color:#6952C8;font-size:16px;font-weight:900
}
.line-pm[data-delta="-1"]{left:4px}.line-pm[data-delta="1"]{right:4px}
.line-multi{gap:23px;padding-bottom:9px;font-size:10px;font-weight:900;color:#96969E}

.line-result-row{
  grid-template-columns:1fr 22px 1fr;
  gap:5px;margin:0 0 5px;width:100%
}
.line-result-part{
  height:37px;border-radius:8px;
  background:#ECECF0;color:#33343A;
  font-size:19px;font-weight:900
}
.line-result-spacer{height:37px}

/* 출근부 + 합 : 같은 줄 반반 */
.line-half-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-bottom:5px
}
.line-half-card{
  height:45px;
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:6px;
  padding:0 8px;
  box-sizing:border-box;
  border:1px solid #E5E5EA;
  border-radius:9px;
  background:#fff
}
.line-half-card span{
  font-size:11px;font-weight:900;color:#62636A;white-space:nowrap
}
.line-half-card input{
  width:100%;min-width:0;height:31px;
  border:0;border-radius:6px;
  background:#F3F3F5;text-align:center;
  font-size:18px;font-weight:900;outline:0
}
.line-half-card.sum{
  background:#F2EEFF;border-color:#E4DCFF
}
.line-half-card.sum span{color:#6952C8}
.line-half-card.sum strong{
  text-align:center;font-size:21px;font-weight:900;color:#5B45B5
}

/* 하단 */
.line-bottom{grid-template-columns:1.1fr .9fr .9fr;gap:5px}
.line-total-wrap,.line-stat{
  min-height:51px;border:1px solid #E6E6EB;
  border-radius:9px;background:#fff
}
.line-total-wrap{height:51px;grid-template-columns:32px 1fr;overflow:hidden}
.line-total-wrap span{
  height:100%;display:flex;align-items:center;justify-content:center;
  border-right:1px solid #ECECEF;font-size:11px;font-weight:900;color:#5E6067
}
.line-total-wrap input{
  height:49px;background:#F5F5F7;font-size:20px;font-weight:900;font-style:normal
}
.line-stat{padding:4px 5px}
.line-stat span{margin:0 0 2px;font-size:10px;color:#65666D}
.line-stat input{
  height:29px;border-radius:6px;background:#F4F4F6;
  font-size:18px;font-weight:900
}
@media(max-width:380px){
 .line-top,.line-result-row{grid-template-columns:1fr 18px 1fr}
 .line-group{padding:5px 4px}
 .line-half-card{padding:0 6px}
}

.line-sum-center{
  width:48%;
  height:42px;
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  box-sizing:border-box;
  border-radius:9px;
  background:#F0ECFF;
  color:#5D49B5;
}
.line-sum-center span{font-size:11px;font-weight:900}
.line-sum-center strong{font-size:21px;font-weight:900}

.line-input-three{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-bottom:5px;
}
.line-input-three .line-stat{
  min-height:51px;
  padding:4px 5px;
  border:1px solid #E6E6EB;
  border-radius:9px;
  background:#fff;
}
.line-input-three .line-stat span{
  display:block;
  margin:0 0 2px;
  text-align:center;
  font-size:10px;
  font-weight:800;
  color:#65666D;
}
.line-input-three .line-stat input{
  width:100%;
  height:29px;
  border:0;
  border-radius:6px;
  background:#F4F4F6;
  text-align:center;
  font-size:18px;
  font-weight:900;
  outline:0;
}

.line-grand-row{
  height:45px;
  display:grid;
  grid-template-columns:1fr 72px;
  gap:5px;
}
.line-grand-value{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-radius:9px;
  background:#292A2E;
  color:#fff;
}
.line-grand-value span{font-size:12px;font-weight:900}
.line-grand-value strong{font-size:22px;font-weight:900}
.line-check{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}
.line-check.ok{background:#EAF7EF;color:#27854A}
.line-check.bad{background:#FDECEC;color:#D24A4A}

/* v33 - 입력 편의성 / 합 강조 */
.line-sheet{padding:4px 0 12px}
.line-top{gap:7px;margin-bottom:8px}
.line-group{padding:9px 8px;border-radius:11px}
.line-num-label{margin-bottom:6px;font-size:13px}

}
.line-pm{

  border-radius:7px;
  font-size:19px;
}
.line-multi{gap:34px;padding-bottom:13px;font-size:11px}

.line-result-row{gap:7px;margin-bottom:8px}
.line-result-part,.line-result-spacer{height:43px}
.line-result-part{font-size:21px;border-radius:9px}

/* 합은 가운데 전체 폭 */
.line-sum-center{

  margin:0 0 8px;
  padding:0 16px;

}
.line-sum-center span{font-size:12px}
.line-sum-center strong{font-size:24px}

/* 출근부 / 인솔 / 교육장 입력 높이 확대 */
.line-input-three{gap:7px;margin-bottom:8px}
.line-input-three .line-stat{

}
.line-input-three .line-stat span{
  margin-bottom:5px;

}
.line-input-three .line-stat input{
  height:37px;
  border-radius:7px;
  font-size:21px;
}

/* 마지막 총 + 합/출근부 차이 */
.line-grand-row{
  height:53px;
  grid-template-columns:1fr 92px;
  gap:7px;
}
.line-grand-value{
  padding:0 15px;
  border-radius:10px;
}
.line-grand-value span{font-size:13px}
.line-grand-value strong{font-size:24px}
.line-check{
  border-radius:10px;
  font-size:12px;
}
.line-check.ok{background:#EEF7F1;color:#3B7D53}
.line-check.bad{background:#FFF0F0;color:#D25555}

/* v36 총/비교 표시 색상 */
.line-grand-value{
  background:#667085;
  color:#fff;
}
.line-check.ok{
  background:#EEF4FF;
  color:#4D6B9B;
}
.line-check.bad{
  background:#FFF1F1;
  color:#D25555;
}

/* v37 줄 탭 디자인 디테일 정리 */
.line-group{
  border-color:#E4E6EC;
  box-shadow:0 1px 3px rgba(30,35,50,.04);
}
.line-group:first-child{box-shadow:inset 0 3px 0 #BFD3FF,0 1px 3px rgba(30,35,50,.04)}

  background:#ECE9FF;

/* 배수 표시는 가운데 작은 배지 형태 */
.line-multi{
  height:100%;
  align-self:stretch;
  justify-content:center;
  gap:28px;
  padding:20px 0 9px;
  box-sizing:border-box;
}
.line-multi span{
  display:flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:22px;
  border-radius:7px;
  background:#F0F1F4;

}

.line-input-three .line-stat{

}
.line-input-three .line-stat input{background:#F5F6F8}

/* 총 영역은 블루그레이보다 조금 더 부드러운 인디고 */
.line-grand-value{
  background:#68749A;
  box-shadow:0 2px 5px rgba(68,78,120,.10);
}

/* 비교 숫자도 총 숫자와 비슷한 크기로 */

}

}
.line-check.bad{

/* v38 위치/정렬 보정 */

/* 줄 탭 내용이 상단에 너무 붙지 않도록 전체를 아래로 */
#julBoard{
  padding-top:18px;
}
.line-sheet{
  width:96%;
  margin:0 auto;
}

/* 합: 라벨은 왼쪽 유지, 숫자만 정확히 중앙 */
.line-sum-center{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.line-sum-center strong{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

/* 총: 라벨은 왼쪽 유지, 숫자만 정확히 중앙 */
.line-grand-value{
  position:relative;
  justify-content:flex-start;
}
.line-grand-value strong{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

/* 위/아래 요소들의 좌우 중심과 여백 통일 */
.line-top,
.line-result-row,
.line-sum-center,
.line-input-three,
.line-grand-row{

}

.line-reset-wrap{

}

}

}
#line-note-input:focus{
  border-color:#CFC6F8;

  box-shadow:0 0 0 3px rgba(112,92,190,.07);
}

/* v41 메모 위치 */
.line-grand-row{margin-bottom:8px}
.line-note{margin:0}

/* v44 연장 3개 뒤 줄바꿈 */
.report-options .report-option-break{flex-basis:100%;width:0;height:0}

/* v47 보고용 연장 옵션 - 주간조 포인트 컬러 */

#opt-ib-extension,

  border-radius:8px;
  padding:6px 9px;
  font-weight:800;
}
</style>
</head>
<body>
<div class="wrap">
<div class="top-tabs"><button class="top-tab active" data-target="weeklyBoard">주간조</button><button class="top-tab" data-target="reportBoard">보고용</button><button class="top-tab" data-target="julBoard">줄</button></div>

    <section class="report-section in">
      <div class="report-heading">출근</div>
      <div class="report-item"><div class="report-text" data-kind="in"></div><button class="report-copy" data-copy-kind="in">복사</button></div>
    </section>

      <div class="report-heading">퇴근</div>

        <label><input type="checkbox" id="opt-ib-extension"> 상온IB 연장</label>
        <label><input type="checkbox" id="opt-cold-extension"> 냉장IB 연장</label>

  <div class="line-reset-wrap"><button type="button" id="line-reset">초기화</button></div>

<script>
const names=["심대원","김담희","유희연"];
const data=[
{key:"ob",title:"상온 OB",target:25,planned:32,existing:31,newcomer:1,training:0,extension:0,manual:0,selected:["김담희","유희연"]},
{key:"ib",title:"상온 IB",target:10,planned:13,existing:13,newcomer:0,training:0,extension:0,manual:0,selected:[]},
{key:"cold",title:"냉장 IB",target:5,planned:5,existing:5,newcomer:0,training:0,extension:0,manual:0,selected:[]}
];
const STORAGE_KEY="dayboard-persistent";
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
function loadData(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!Array.isArray(saved))return;saved.forEach(savedItem=>{const x=data.find(d=>d.key===savedItem.key);if(!x)return;["target","planned","existing","newcomer","training","extension","manual"].forEach(k=>{if(Number.isFinite(Number(savedItem[k])))x[k]=Number(savedItem[k])});if(Array.isArray(savedItem.selected))x.selected=savedItem.selected.filter(n=>names.includes(n))})}catch(e){}}
loadData();
const labels=[["target","목표 T/O"],["planned","예정 T/O"],["existing","기존"],["newcomer","신규"],["training","재교육"],["extension","연장가능"],["manual","수기작성"]];
function today(){const d=new Date(),w=["일","월","화","수","목","금","토"];return `${d.getMonth()+1}월 ${d.getDate()}일 (${w[d.getDay()]})`}
function item(key){return data.find(x=>x.key===key)}
function report(x){const p=x.selected;return `컬리 K팀 ${today()}

${x.title} 13시30분 인원투입 공유
(13:30 ~ 22:30)

인솔담당 - ${p.length}명${p.length?` (${p.join(", ")})`:""}

총 T/O : ${x.target} / ${x.planned} (기존 ${x.existing}, 신규 ${x.newcomer}${x.training?`, 재교육 ${x.training}`:""})

계약
컬리로 : ${x.planned}명
수기작성 : ${x.manual}명

연장 가능 인원 : ${x.extension}명

총 투입 인원 : ${x.planned+x.extension}명`}
function card(x){return `<section class="card ${x.key}"><div class="title">${x.title}</div><div class="body"><div class="left"><div class="people-row"><div class="people-title">인솔담당</div><div class="people">${names.map(n=>`<label class="person"><input type="checkbox" data-person="${n}" data-key="${x.key}" ${x.selected.includes(n)?"checked":""}>${n}</label>`).join("")}</div></div>${labels.map(([k,l])=>`<div class="field"><label>${l}</label><div class="stepper"><input inputmode="numeric" type="number" min="0" value="${x[k]}" data-field="${k}" data-key="${x.key}"><div class="step-controls"><button type="button" class="step-btn" data-step="-1" data-step-field="${k}" data-key="${x.key}">−</button><button type="button" class="step-btn" data-step="1" data-step-field="${k}" data-key="${x.key}">+</button></div></div></div>`).join("")}</div><div class="right"><div class="preview" id="preview-${x.key}"></div><button class="copy" data-copy="${x.key}">📋 복사</button></div></div></section>`}
document.getElementById("app").innerHTML=data.map(card).join("");
function update(key){const x=item(key),detailTotal=x.existing+x.newcomer+x.training,mismatch=detailTotal!==x.planned;
  const edu=document.getElementById("sum-edu");
  if(edu){
    const eduTotal=data.reduce((t,r)=>t+(Number(r.newcomer)||0)+(Number(r.training)||0),0);
    edu.textContent=`교육장 : ${eduTotal}`;
  }document.getElementById("preview-"+key).textContent=report(x);const sum=document.getElementById("sum-"+key);sum.innerHTML=`<table class="sum-table ${mismatch?"mismatch":""}"><tr><th>T</th><th>기</th><th>신</th><th>재</th></tr><tr><td>${x.target}/${x.planned}</td><td>${x.existing}</td><td class="${x.newcomer>0?'positive-purple':''}">${x.newcomer}</td><td class="${x.training>0?'positive-purple':''}">${x.training}</td></tr></table>`;["existing","newcomer","training"].forEach(field=>{const el=document.querySelector(`[data-field="${field}"][data-key="${key}"]`);if(el)el.classList.toggle("mismatch",mismatch)});if(key==="ob"){document.getElementById("sum-guide").textContent=`인솔 : ${x.selected.length}`;document.getElementById("sum-line").textContent=`줄 : ${Math.max(0,x.existing-x.selected.length)}`}}
data.forEach(x=>update(x.key));
document.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("input",()=>{const x=item(el.dataset.key);x[el.dataset.field]=Number(el.value)||0;update(x.key);saveData()}));
document.querySelectorAll("[data-step]").forEach(btn=>btn.addEventListener("click",()=>{const x=item(btn.dataset.key),field=btn.dataset.stepField,next=Math.max(0,(Number(x[field])||0)+Number(btn.dataset.step));x[field]=next;const input=document.querySelector(`[data-field="${field}"][data-key="${x.key}"]`);if(input)input.value=next;update(x.key);saveData()}));
document.querySelectorAll("[data-person]").forEach(el=>el.addEventListener("change",()=>{const x=item(el.dataset.key);x.selected=[...document.querySelectorAll(`[data-person][data-key="${x.key}"]:checked`)].map(e=>e.dataset.person);update(x.key);saveData()}));

async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch(e){}}const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
document.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",async()=>{const box=document.getElementById("preview-"+btn.dataset.copy),ok=await copyText(box.textContent);if(ok){btn.textContent="✓ 복사 완료";btn.classList.add("ok");setTimeout(()=>{btn.textContent="📋 복사";btn.classList.remove("ok")},1200)}else{const range=document.createRange();range.selectNodeContents(box);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);alert("브라우저가 자동 복사를 차단했습니다. 선택된 내용을 길게 눌러 복사해주세요.")}}));

// 보고용: 이미지 문구 + 선택한 특이사항만 퇴근 문구에 추가
function openBoard(target){
  document.querySelectorAll(".top-tab").forEach(x=>x.classList.toggle("active",x.dataset.target===target));
  document.querySelectorAll(".board-page").forEach(x=>x.classList.toggle("active",x.id===target));
}
document.querySelectorAll(".top-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    openBoard(btn.dataset.target);
    try{localStorage.setItem("dayboard-active-tab",btn.dataset.target)}catch(e){}
  });
});
try{
  const savedTab=localStorage.getItem("dayboard-active-tab");
  if(savedTab && document.getElementById(savedTab)) openBoard(savedTab);
}catch(e){}

function reportDate(){
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function reportMessages(){
  const dateLine=`컬리K팀 ${reportDate()}`;
  const coldExtension=document.getElementById("opt-cold-extension").checked;
  const obExtension=document.getElementById("opt-ob-extension").checked;
  const ibExtension=document.getElementById("opt-ib-extension").checked;
  const inHeader=`${dateLine}\n상온OB, IB, 냉장IB 13시30분조`;
  const outAreaList=[];
  if(!obExtension) outAreaList.push("상온OB");
  if(!ibExtension) outAreaList.push(obExtension ? "상온IB" : "IB");
  if(!coldExtension) outAreaList.push("냉장IB");
  const outAreas=outAreaList.join(", ");
  const outHeader=`${dateLine}\n${outAreas}${outAreas ? " " : ""}13시30분조`;
  const extras=[];
  if(document.getElementById("opt-early").checked) extras.push("•조퇴 1명(000)");
  if(document.getElementById("opt-nosign").checked) extras.push("•퇴근 미서명 1명(000)");
  if(document.getElementById("opt-wage").checked) extras.push("•임금공제동의서 1명(000)");
  return {
    in:`${inHeader}\n컬리로 불가인원 없습니다.`,
    out:`${outHeader}\n퇴근 완료했습니다. (연장X)${extras.length?"\n"+extras.join("\n"):""}`
  };
}
function drawReport(){
  const m=reportMessages();
  document.querySelector('[data-kind="in"]').textContent=m.in;
  document.querySelector('[data-kind="out"]').textContent=m.out;
}
["opt-cold-extension","opt-ob-extension","opt-ib-extension","opt-early","opt-nosign","opt-wage"].forEach(id=>{
  document.getElementById(id).addEventListener("change",drawReport);
});
drawReport();

document.querySelectorAll("[data-copy-kind]").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    const msg=reportMessages()[btn.dataset.copyKind];
    const ok=await copyText(msg);
    if(ok){
      btn.textContent="✓";
      setTimeout(()=>btn.textContent="복사",1000);
    }else{
      alert("복사가 차단되었습니다. 문구를 길게 눌러 복사해주세요.");
    }
  });
});

// 줄 탭 계산 + 일일 저장/초기화 - v39
(function(){
  const LINE_KEY="dayboard-line-daily";
  const inputIds=[
    "line1-main","line1-sub","line2-main","line2-sub",
    "line-attendance-input","line-guide","line-training"
  ];
  const noteId="line-note-input";

  function dateKey(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  const value=id=>{
    const el=document.getElementById(id);
    return el ? Math.max(0,Number(el.value)||0) : 0;
  };
  function calculate(){
    const one=value("line1-main")*5+value("line1-sub");
    const two=value("line2-main")*5+value("line2-sub");
    const sum=one+two;
    const guide=value("line-guide");
    const training=value("line-training");
    const attendance=value("line-attendance-input");
    const grand=sum+guide+training;

    document.getElementById("line-one").textContent=one;
    document.getElementById("line-two").textContent=two;
    document.getElementById("line-total").textContent=sum;
    document.getElementById("line-grand").textContent=grand;

    const diff=sum-attendance;
    const check=document.getElementById("line-check");
    check.textContent=(diff>0?"+":"")+diff;
    check.classList.toggle("ok",diff===0);
    check.classList.toggle("bad",diff!==0);
  }
  function saveLine(){
    const values={};
    inputIds.forEach(id=>values[id]=value(id));
    const note=document.getElementById(noteId)?.value || "";
    try{localStorage.setItem(LINE_KEY,JSON.stringify({date:dateKey(),values,note}))}catch(e){}
  }
  function resetLine(save=true){
    inputIds.forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.value=0;
    });
    const note=document.getElementById(noteId);
    if(note) note.value="";
    calculate();
    if(save) saveLine();
  }
  function loadLine(){
    try{
      const saved=JSON.parse(localStorage.getItem(LINE_KEY));
      if(!saved || saved.date!==dateKey()){
        resetLine(true);
        return;
      }
      inputIds.forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.value=Math.max(0,Number(saved.values?.[id])||0);
      });
      const note=document.getElementById(noteId);
      if(note) note.value=saved.note || "";
    }catch(e){
      resetLine(false);
    }
    calculate();
  }

  document.querySelectorAll(".line-pm").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const el=document.getElementById(btn.dataset.for);
      if(!el)return;
      el.value=Math.max(0,(Number(el.value)||0)+Number(btn.dataset.delta));
      calculate();
      saveLine();
    });
  });

  inputIds.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("input",()=>{
      calculate();
      saveLine();
    });
  });

  const note=document.getElementById(noteId);
  if(note) note.addEventListener("input",saveLine);

  const resetBtn=document.getElementById("line-reset");
  if(resetBtn) resetBtn.addEventListener("click",()=>resetLine(true));

  loadLine();
})();

</script>
</body>
